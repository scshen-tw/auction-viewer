<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWSE / TPEX 競拍資料庫</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', 'Consolas', '微軟正黑體', monospace; font-size: 13px; background: #000000; color: #C8C8C8; }
body.col-resizing { cursor: col-resize; user-select: none; }

/* ── Header ─────────────────── */
.hdr { background: #000000; color: #FF6600; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #FF6600; }
.hdr h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.hdr .meta { font-size: 11px; color: #888888; }

/* ── Controls ───────────────── */
.ctrl { background: #0A0A0A; padding: 10px 20px; border-bottom: 1px solid #333333;
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
.tabs { display: flex; gap: 4px; }
.tab  { padding: 6px 16px; border: 1px solid #444444; border-radius: 0; cursor: pointer;
        background: #111111; font: inherit; font-size: 13px; transition: .15s; color: #AAAAAA; }
.tab.active { background: #FF6600; color: #000000; border-color: #FF6600; font-weight: 700; }
.tab:hover:not(.active) { background: #1A1A1A; border-color: #FF6600; color: #FF6600; }
#search { padding: 6px 11px; border: 1px solid #444444; border-radius: 0;
          font: inherit; font-size: 13px; width: 200px; outline: none; background: #0D0D0D; color: #C8C8C8; }
#search:focus { border-color: #FF6600; box-shadow: 0 0 0 1px #FF660044; }
.stat-badge { margin-left: auto; background: #1A1A1A; border-radius: 0;
              padding: 3px 10px; font-size: 11px; color: #FF6600; white-space: nowrap; border: 1px solid #333333; }

/* ── Legend ─────────────────── */
.legend { display: flex; gap: 12px; align-items: center; font-size: 11px; color: #888888; }
.dot { width: 10px; height: 10px; border-radius: 0; display: inline-block; margin-right: 3px; }
.dot-done     { background: #004400; border: 1px solid #00AA00; }
.dot-pending  { background: #4A4A4A; border: 1px solid #777777; }
.dot-noresult { background: #2A0A00; border: 1px solid #AA4400; }
.dot-cancel   { background: #1A1A1A; border: 1px solid #444444; }

/* ── Table ──────────────────── */
.tbl-wrap { overflow: auto; height: calc(100vh - 95px); }
table { width: 100%; border-collapse: collapse; background: #000000; }
thead { position: sticky; top: 0; z-index: 10; }
thead tr:first-child { background: #1A1A1A; color: #FF6600; }
th { position: relative; padding: 8px 10px; text-align: left; white-space: nowrap; cursor: pointer;
     user-select: none; font-weight: 700; border-right: 1px solid #333333; overflow: hidden; }
th:hover { background: #2A2A2A; color: #FFAA33; }
.resizer { position: absolute; right: 0; top: 0; bottom: 0; width: 6px;
           cursor: col-resize; z-index: 2; border-right: 2px solid transparent; }
.resizer:hover { border-right-color: rgba(255,102,0,0.5); }
.col-resizing .resizer.active { border-right-color: #FF6600; }
th:last-child { border-right: none; }
th .si { margin-left: 5px; opacity: .5; font-size: 10px; }
th.asc  .si::after { content: '▲'; opacity: 1; }
th.desc .si::after { content: '▼'; opacity: 1; }
th:not(.asc):not(.desc) .si::after { content: '⇅'; }
td { padding: 6px 10px; border-bottom: 1px solid #1A1A1A; white-space: nowrap; vertical-align: middle;
     overflow: hidden; text-overflow: ellipsis; }
tr:hover td { background: #1A1A1A !important; }

/* row status */
tr.s-done     td { background: #001400; }
tr.s-pending  td { background: #3E3E3E; }
tr.s-noresult td { background: #1A0800; }
tr.s-cancel   td { background: #0D0D0D; color: #555555; }

td.r  { text-align: right; font-variant-numeric: tabular-nums; }
td.c  { text-align: center; }
td.mono { font-family: 'Courier New', 'Consolas', monospace; }
td.bold { font-weight: 700; }

/* badges */
.badge { display: inline-block; padding: 1px 6px; border-radius: 0; font-size: 0.8em; font-weight: 700; }
.b-tse   { background: #001833; color: #3399FF; }
.b-otc   { background: #001800; color: #00CC44; }
.b-cncl  { background: #1A0000; color: #FF3333; }
.b-pend  { background: #1A1600; color: #FFCC00; }
.txt-secured { color: #00CCFF; font-weight: 700; }

/* highlight: 收盤 vs 得標均價 */
.hi-up  { color: #00CC44; font-weight: 700; }   /* 收盤 > 得標均價 (positive for bidders) */
.hi-dn  { color: #FF3333; font-weight: 700; }   /* 收盤 < 得標均價 */

.empty-msg { text-align: center; padding: 60px 20px; color: #444444; font-size: 15px; }

/* ── Refresh button ──────────── */
#btn-refresh { padding: 5px 13px; border: 1px solid #444444; border-radius: 0; cursor: pointer;
               background: #111111; font: inherit; font-size: 13px; transition: .15s; color: #AAAAAA;
               display: inline-flex; align-items: center; gap: 5px; }
#btn-refresh:hover:not(:disabled) { background: #1A1A1A; border-color: #FF6600; color: #FF6600; }
#btn-refresh:disabled { opacity: .4; cursor: not-allowed; }
.spin { display: inline-block; }
#btn-refresh.spinning .spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { padding: 3px 11px; border-radius: 0; font-size: 11px; font-weight: 700;
         white-space: nowrap; display: none; }
.toast.info    { display: inline-block; background: #001833; color: #3399FF; }
.toast.success { display: inline-block; background: #001400; color: #00CC44; }
.toast.warn    { display: inline-block; background: #1A1600; color: #FFCC00; }
.toast.error   { display: inline-block; background: #1A0000; color: #FF3333; }

/* ── Column filter row ───────── */
.filter-row th { background: #0D0D0D; padding: 3px 4px;
                 border-right: 1px solid #333333; border-bottom: 2px solid #FF6600; }
.filter-row th:last-child { border-right: none; }
.fi { width: 100%; padding: 2px 5px; font-size: 11px; border: 1px solid #333333;
      background: #000000; color: #C8C8C8; border-radius: 0; font-family: inherit;
      box-sizing: border-box; }
.fi::placeholder { color: #555555; font-size: 10px; }
.fi:focus { outline: none; border-color: #FF6600; background: #0A0A0A; }
.fi.active { border-color: #FF6600; background: #1A0D00; color: #FF6600; }

/* ── Column panel ───────────── */
#btn-cols { padding: 5px 13px; border: 1px solid #444444; border-radius: 0; cursor: pointer;
            background: #111111; font: inherit; font-size: 13px; transition: .15s; color: #AAAAAA; }
#btn-cols:hover { background: #1A1A1A; border-color: #FF6600; color: #FF6600; }
#btn-cols.active { background: #FF6600; color: #000000; border-color: #FF6600; font-weight: 700; }
.font-ctrl { display: inline-flex; align-items: center; gap: 3px; }
.font-ctrl button { padding: 4px 8px; border: 1px solid #444444; border-radius: 0; cursor: pointer;
                    background: #111111; font: inherit; font-size: 12px; transition: .15s; color: #AAAAAA; }
.font-ctrl button:hover { background: #1A1A1A; border-color: #FF6600; color: #FF6600; }
.font-ctrl #font-label { font-size: 11px; color: #888888; min-width: 30px; text-align: center; }

#col-panel { display: none; position: absolute; top: 100%; left: 0; right: 0;
             background: #0A0A0A; border-bottom: 2px solid #FF6600; padding: 10px 20px;
             z-index: 99; box-shadow: 0 4px 12px #000000; }
#col-panel.open { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
.col-item { display: flex; align-items: center; gap: 5px; padding: 4px 8px;
            border: 1px solid #333333; border-radius: 0; background: #111111;
            cursor: grab; user-select: none; font-size: 12px; white-space: nowrap;
            transition: background .1s; color: #AAAAAA; }
.col-item:hover { background: #1A1A1A; border-color: #FF6600; color: #FF6600; }
.col-item.drag-over { border: 2px dashed #FF6600; background: #1A0D00; }
.col-item.dragging  { opacity: .4; }
.col-item .drag-h { color: #555555; font-size: 13px; cursor: grab; }
.col-item input[type=checkbox] { cursor: pointer; width: 14px; height: 14px; }
.col-item label { cursor: pointer; }
.col-panel-hint { font-size: 11px; color: #555555; align-self: center; margin-left: auto; }

/* ── Chart modal ─────────────────── */
#btn-chart { padding: 5px 13px; border: 1px solid #444444; border-radius: 0; cursor: pointer;
             background: #111111; font: inherit; font-size: 13px; transition: .15s; color: #AAAAAA; }
#btn-chart:hover { background: #1A1A1A; border-color: #FF6600; color: #FF6600; }
#btn-chart.active { background: #FF6600; color: #000000; border-color: #FF6600; font-weight: 700; }
.chart-modal { display: none; position: fixed; inset: 0; background: #000000;
               z-index: 200; flex-direction: column; }
.chart-modal.open { display: flex; }
.chart-modal-hdr { background: #0A0A0A; border-bottom: 2px solid #FF6600;
                   padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chart-modal-hdr h2 { font-size: 14px; color: #FF6600; font-weight: 700; white-space: nowrap; margin-right: 8px; }
.chart-modal-body { flex: 1; padding: 16px; overflow: auto; display: flex; flex-direction: column; }
.chart-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
                 margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #333; }
.chart-filters label { font-size: 11px; color: #888; }
.chart-filters input, .chart-filters select {
  background: #0D0D0D; color: #C8C8C8; border: 1px solid #444; border-radius: 0;
  padding: 3px 6px; font: inherit; font-size: 12px; outline: none; }
.chart-filters input:focus, .chart-filters select:focus { border-color: #FF6600; }
.chart-filters .fg { display: flex; align-items: center; gap: 4px; }
.chart-canvas-wrap { flex: 1; min-height: 400px; position: relative; }
.chart-close { margin-left: auto; padding: 4px 10px; border: 1px solid #666; border-radius: 0;
               background: transparent; color: #AAAAAA; cursor: pointer; font: inherit; font-size: 13px; }
.chart-close:hover { border-color: #FF6600; color: #FF6600; }
.chart-legend { font-size: 11px; color: #888; padding-top: 8px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="hdr">
  <h1>TWSE / TPEX &nbsp;競價拍賣資料庫</h1>
  <div class="meta">資料來源：臺灣證券交易所 &nbsp;｜&nbsp; 最後更新：2026-08-27 08:00</div>
</div>

<div class="ctrl" style="position:relative;">
  <div class="tabs">
    <button class="tab"        onclick="switchTab('stocks')">股票競拍 (485)</button>
    <button class="tab active" onclick="switchTab('cbs')">CB競拍 (369)</button>
  </div>
  <input type="search" id="search" placeholder="搜尋代號、名稱…" oninput="render()">
  <button id="btn-refresh" onclick="doRefresh()" title="手動更新資料（需透過 auction_server.py 啟動）">
    <span class="spin">↻</span> 更新
  </button>
  <button id="btn-cols" onclick="toggleColPanel()" title="欄位顯示 / 排序">⚙ 欄位</button>
  <button id="btn-chart" onclick="openChart()" title="散點圖分析">◈ 圖表</button>
  <div id="rel-n-ctrl" class="font-ctrl" title="相對大盤漲跌期間" style="display:none;">
    <label style="font-size:11px;color:#888;margin-right:3px;">相對大盤</label>
    <select id="sel-rel-n" onchange="_relN=+this.value;render();"
      style="background:#111;color:#FF6600;border:1px solid #444;font:inherit;font-size:12px;padding:1px 3px;">
      <option value="5">5d</option>
      <option value="10">10d</option>
      <option value="20">20d</option>
    </select>
  </div>
  <div class="font-ctrl" title="字體大小">
    <button onclick="changeFontSize(-1)">A−</button>
    <span id="font-label">13px</span>
    <button onclick="changeFontSize(+1)">A+</button>
  </div>
  <span id="toast" class="toast"></span>
  <div class="legend">
    <span><span class="dot dot-done"></span>已開標</span>
    <span><span class="dot dot-noresult"></span>待結果</span>
    <span><span class="dot dot-pending"></span>待投標</span>
    <span><span class="dot dot-cancel"></span>流標/取消</span>
  </div>
  <span class="stat-badge" id="stat"></span>
  <div id="col-panel"></div>
</div>

<!-- CB 散點圖 modal -->
<div id="modal-cb" class="chart-modal">
  <div class="chart-modal-hdr">
    <h2>◈ CB競拍 — 最低標溢價率分佈</h2>
    <div class="chart-filters">
      <div class="fg"><label>截止日</label>
        <input type="date" id="cb-date-from"> ~ <input type="date" id="cb-date-to">
      </div>
      <div class="fg"><label>TCRI</label>
        <select id="cb-tcri-min" style="width:55px">
          <option value="">min</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option>
        </select>
        ~
        <select id="cb-tcri-max" style="width:55px">
          <option value="">max</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option>
        </select>
      </div>
      <div class="fg"><label>競拍量(張) ≥</label>
        <input type="number" id="cb-vol-min" style="width:80px" placeholder="0">
      </div>
      <div class="fg"><label>Parity%</label>
        <input type="number" id="cb-parity-min" style="width:60px" placeholder="min">
        ~
        <input type="number" id="cb-parity-max" style="width:60px" placeholder="max">
      </div>
      <button onclick="renderCbChart()" style="padding:3px 10px;border:1px solid #FF6600;
        background:#1A0D00;color:#FF6600;cursor:pointer;font:inherit;border-radius:0;">套用</button>
    </div>
    <button class="chart-close" onclick="closeChart()">✕ 關閉</button>
  </div>
  <div class="chart-modal-body">
    <div class="chart-canvas-wrap"><canvas id="canvas-cb"></canvas></div>
    <div class="chart-legend" id="cb-legend"></div>
  </div>
</div>

<!-- 股票散點圖 modal -->
<div id="modal-stk" class="chart-modal">
  <div class="chart-modal-hdr">
    <h2>◈ 股票競拍 — 截拍前相對大盤 vs 得標折價率</h2>
    <div class="chart-filters">
      <div class="fg"><label>截止日</label>
        <input type="date" id="stk-date-from"> ~ <input type="date" id="stk-date-to">
      </div>
      <div class="fg"><label>相對大盤期間</label>
        <select id="stk-ndays">
          <option value="5">5 個交易日</option>
          <option value="10">10 個交易日</option>
          <option value="20">20 個交易日</option>
        </select>
      </div>
      <div class="fg"><label>相對大盤% 範圍</label>
        <input type="number" id="stk-rel-min" style="width:65px" placeholder="min">
        ~
        <input type="number" id="stk-rel-max" style="width:65px" placeholder="max">
      </div>
      <button onclick="renderStkChart()" style="padding:3px 10px;border:1px solid #FF6600;
        background:#1A0D00;color:#FF6600;cursor:pointer;font:inherit;border-radius:0;">套用</button>
    </div>
    <button class="chart-close" onclick="closeChart()">✕ 關閉</button>
  </div>
  <div class="chart-modal-body">
    <div class="chart-canvas-wrap"><canvas id="canvas-stk"></canvas></div>
    <div class="chart-legend" id="stk-legend"></div>
  </div>
</div>

<div class="tbl-wrap">
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-msg" id="empty" style="display:none">沒有符合的資料</div>
</div>

// ── Column visibility & order ─────────────────────────────────────────────────
// Stored in localStorage as { order:[...keys], hidden:[...keys] }
const _colStateCache = {};

function _colStateKey(t) { return 'col_state_v1_' + t; }

function getColState(t) {
  if (!_colStateCache[t]) {
    try {
      const d = JSON.parse(localStorage.getItem(_colStateKey(t)) || 'null');
      _colStateCache[t] = { order: d?.order || null, hidden: new Set(d?.hidden || []) };
    } catch { _colStateCache[t] = { order: null, hidden: new Set() }; }
  }
  return _colStateCache[t];
}

function saveColState(t) {
  const s = _colStateCache[t];
  if (!s) return;
  try { localStorage.setItem(_colStateKey(t), JSON.stringify({ order: s.order, hidden: [...s.hidden] })); } catch {}
}

function getEffectiveCols() {
  const base = tab === 'stocks' ? STOCK_COLS : CB_COLS;
  const s = getColState(tab);
  let ordered = base;
  if (s.order) {
    const map = Object.fromEntries(base.map(c => [c.k, c]));
    const known = new Set(s.order);
    ordered = [
      ...s.order.map(k => map[k]).filter(Boolean),
      ...base.filter(c => !known.has(c.k)),   // newly added cols go to end
    ];
  }
  return ordered.filter(c => !s.hidden.has(c.k));
}

// Returns all cols (including hidden) in saved order — for the panel
function getAllColsOrdered() {
  const base = tab === 'stocks' ? STOCK_COLS : CB_COLS;
  const s = getColState(tab);
  if (!s.order) return base;
  const map = Object.fromEntries(base.map(c => [c.k, c]));
  const known = new Set(s.order);
  return [
    ...s.order.map(k => map[k]).filter(Boolean),
    ...base.filter(c => !known.has(c.k)),
  ];
}

// ── Column filters ────────────────────────────────────────────────────────────
const filters   = {};   // colKey → {op, v1, v2}
const filterRaw = {};   // colKey → raw string the user typed

function parseFilter(str) {
  str = str.trim();
  if (!str) return null;
  // range:  50~100  50～100  50-100
  const rng = str.match(/^(-?[\d.]+)\s*[~～\-]\s*(-?[\d.]+)$/);
  if (rng) return {op:'range', v1:+rng[1], v2:+rng[2]};
  // comparison:  >=50  <=50  >50  <50
  const cmp = str.match(/^(>=|<=|>|<)\s*(-?[\d.]+)$/);
  if (cmp) return {op:cmp[1], v1:+cmp[2]};
  // exact number
  if (/^-?[\d.]+$/.test(str)) return {op:'=', v1:+str};
  return null;
}

function applyFilter(f, n) {
  if (isNaN(n)) return false;
  if (f.op === 'range') return n >= f.v1 && n <= f.v2;
  if (f.op === '>')     return n >  f.v1;
  if (f.op === '<')     return n <  f.v1;
  if (f.op === '>=')    return n >= f.v1;
  if (f.op === '<=')    return n <= f.v1;
  if (f.op === '=')     return n === f.v1;
  return true;
}

function onFilterInput(inp) {
  const key = inp.dataset.key;
  filterRaw[key] = inp.value;          // keep raw text so rebuild can restore it
  const f = parseFilter(inp.value);
  if (f) filters[key] = f; else delete filters[key];
  inp.classList.toggle('active', !!f);
  render();
}

// ── Server / refresh ──────────────────────────────────────────────────────────
// Always try localhost:8787 — works from both http:// and file://
// (server sends Access-Control-Allow-Origin: * so CORS is not an issue)
const LOCAL    = 'http://localhost:8787';
const IS_LOCAL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
const IS_HTTP  = (window.location.protocol !== 'file:');
let   _srv       = IS_LOCAL ? '' : LOCAL;  // base URL; confirmed after ping
let   _srvReady  = IS_LOCAL;               // true once server confirmed reachable
let   _pollTimer = null;

function showToast(msg, cls, ms = 5000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast ' + cls;
  if (ms > 0) setTimeout(() => { t.className = 'toast'; }, ms);
}

function _fetchT(url, ms = 3000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, {signal: ctrl.signal}).finally(() => clearTimeout(tid));
}

async function _pingServer() {
  try {
    const r = await _fetchT(LOCAL + '/api/refresh-status', 2500);
    _srvReady = r.ok;
  } catch { _srvReady = false; }
  return _srvReady;
}

async function refreshData() {
  const oldS = RAW.stocks.length, oldC = RAW.cbs.length;
  const oldPend = RAW.stocks.filter(r => rowStatus(r) === 'noresult').length
                + RAW.cbs.filter(r    => rowStatus(r) === 'noresult').length;
  try {
    const d = await _fetchT(_srv + '/api/data').then(r => r.json());
    RAW.stocks = d.stocks;
    RAW.cbs    = d.cbs;
    document.querySelectorAll('.tab')[0].textContent = `股票競拍 (${RAW.stocks.length})`;
    document.querySelectorAll('.tab')[1].textContent = `CB競拍 (${RAW.cbs.length})`;
    if (d.timestamp) {
      document.querySelector('.hdr .meta').innerHTML =
        `資料來源：臺灣證券交易所 &nbsp;｜&nbsp; 最後更新：${d.timestamp}`;
    }
    const newPend    = RAW.stocks.filter(r => rowStatus(r) === 'noresult').length
                     + RAW.cbs.filter(r    => rowStatus(r) === 'noresult').length;
    const addedTotal  = (RAW.stocks.length - oldS) + (RAW.cbs.length - oldC);
    const newlyOpened = Math.max(0, oldPend - newPend);
    let msg = '資料已是最新';
    if (addedTotal > 0)    msg = `新增 ${addedTotal} 筆競拍（股票+${RAW.stocks.length-oldS} CB+${RAW.cbs.length-oldC}）`;
    else if (newlyOpened > 0) msg = `${newlyOpened} 筆已補入開標結果`;
    showToast(msg, addedTotal + newlyOpened > 0 ? 'success' : 'info');
    render();
  } catch(e) {
    showToast('載入資料失敗', 'error');
  }
}

function _startPolling(btn) {
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(async () => {
    const s = await _fetchT(_srv + '/api/refresh-status')
                    .then(r => r.json()).catch(() => ({running: false}));
    if (!s.running) {
      clearInterval(_pollTimer); _pollTimer = null;
      btn.disabled = false; btn.classList.remove('spinning');
      await refreshData();
    }
  }, 2000);
}

let _fontSize = parseInt(localStorage.getItem('fontSize') || '13');
function applyFontSize(sz) {
  _fontSize = Math.min(20, Math.max(10, sz));
  document.body.style.fontSize = _fontSize + 'px';
  document.getElementById('font-label').textContent = _fontSize + 'px';
  localStorage.setItem('fontSize', _fontSize);
}

// ── Column resize ─────────────────────────────────────────────────────────────
let _colWidths = (() => { try { return JSON.parse(localStorage.getItem('colWidths') || '{}'); } catch(e) { return {}; } })();
let _rz = null;

function _freezeAllCols() {
  // 把所有欄位凍結成當前實際寬度，table 改為 auto 可自由延伸
  const tbl = document.querySelector('table');
  tbl.style.tableLayout = 'fixed';
  tbl.style.width = 'auto';
  document.querySelectorAll('#thead tr:first-child th').forEach(th => {
    const w = th.offsetWidth;
    th.style.width    = w + 'px';
    th.style.minWidth = w + 'px';
  });
}

function initResizers() {
  const widths = _colWidths[tab] || {};
  const tbl    = document.querySelector('table');
  const hasW   = Object.keys(widths).length > 0;
  if (hasW) {
    tbl.style.tableLayout = 'fixed';
    tbl.style.width = 'auto';
    document.querySelectorAll('#thead tr:first-child th').forEach(th => {
      const w = widths[th.dataset.colKey];
      if (w) { th.style.width = w + 'px'; th.style.minWidth = w + 'px'; }
      else   { th.style.width = ''; th.style.minWidth = ''; }
    });
  } else {
    tbl.style.tableLayout = '';
    tbl.style.width = '';
  }
}

function onRzDown(e, el) {
  e.preventDefault(); e.stopPropagation();
  _freezeAllCols();   // 凍結所有欄，拖拉時只動被拉的那欄
  const th = el.closest('th');
  _rz = { th, el, startX: e.clientX, startW: th.offsetWidth };
  el.classList.add('active');
  document.body.classList.add('col-resizing');
  document.addEventListener('mousemove', onRzMove);
  document.addEventListener('mouseup',   onRzUp);
}

function onRzMove(e) {
  if (!_rz) return;
  const w = Math.max(36, _rz.startW + e.clientX - _rz.startX);
  _rz.th.style.width    = w + 'px';
  _rz.th.style.minWidth = w + 'px';
}

function onRzUp() {
  if (!_rz) return;
  // 儲存所有欄位當前寬度
  if (!_colWidths[tab]) _colWidths[tab] = {};
  document.querySelectorAll('#thead tr:first-child th').forEach(th => {
    const key = th.dataset.colKey;
    if (key) _colWidths[tab][key] = th.offsetWidth;
  });
  localStorage.setItem('colWidths', JSON.stringify(_colWidths));
  _rz.el.classList.remove('active');
  document.body.classList.remove('col-resizing');
  _rz = null;
  document.removeEventListener('mousemove', onRzMove);
  document.removeEventListener('mouseup',   onRzUp);
}

function onRzDblClick(e, el) {
  e.stopPropagation();
  // 雙擊重置所有欄位寬度
  delete _colWidths[tab];
  localStorage.setItem('colWidths', JSON.stringify(_colWidths));
  const tbl = document.querySelector('table');
  tbl.style.tableLayout = '';
  tbl.style.width = '';
  document.querySelectorAll('#thead tr:first-child th').forEach(th => {
    th.style.width = ''; th.style.minWidth = '';
  });
  initResizers();
}

async function doRefresh() {
  const btn = document.getElementById('btn-refresh');

  // If opened as file://, probe the server first (quick 2.5s timeout)
  if (!IS_HTTP) {
    showToast('連線本機伺服器中…', 'info', 0);
    const ok = await _pingServer();
    if (!ok) {
      // 伺服器未啟動：顯示固定提示列，不做任何自動跳頁
      _showServerBanner();
      btn.disabled = false;
      return;
    }
    _srv = LOCAL;
  }

  btn.disabled = true;
  btn.classList.add('spinning');
  showToast('正在連線 TWSE 更新資料…', 'info', 0);
  try {
    await _fetchT(_srv + '/api/refresh');
    _startPolling(btn);
  } catch(e) {
    btn.disabled = false; btn.classList.remove('spinning');
    showToast('無法連線伺服器', 'error');
  }
}

function _showServerBanner() {

    '<button onclick="this.parentNode.remove()" ' +

// ── Column panel ──────────────────────────────────────────────────────────────
let _dragSrc = null;

function toggleColPanel() {
  const panel = document.getElementById('col-panel');
  const btn   = document.getElementById('btn-cols');
  if (panel.classList.contains('open')) {
    panel.classList.remove('open'); btn.classList.remove('active');
  } else {
    _buildColPanel(); panel.classList.add('open'); btn.classList.add('active');
  }
}

function _buildColPanel() {
  const panel = document.getElementById('col-panel');
  const s     = getColState(tab);
  const all   = getAllColsOrdered();

  panel.innerHTML = all.map(c => {
    const hidden  = s.hidden.has(c.k);
    const safeK   = c.k.replace(/"/g, '&quot;');
    const safeL   = c.lab.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="col-item" draggable="true" data-k="${safeK}"
      ondragstart="_colDragStart(event)" ondragover="_colDragOver(event)"
      ondragleave="_colDragLeave(event)" ondrop="_colDrop(event)" ondragend="_colDragEnd(event)">
      <span class="drag-h">⠿</span>
      <input type="checkbox" id="chk_${safeK}" ${hidden?'':'checked'}
        onchange="_colToggle('${safeK}',this.checked)" onclick="event.stopPropagation()">
      <label for="chk_${safeK}" onclick="event.stopPropagation()">${safeL}</label>
    </div>`;
  }).join('') + '<span class="col-panel-hint">拖曳可調整順序</span>';
}

function _colToggle(k, visible) {
  const s = getColState(tab);
  if (visible) s.hidden.delete(k); else s.hidden.add(k);
  saveColState(tab);
  render();
}

function _colDragStart(e) {
  _dragSrc = e.currentTarget;
  _dragSrc.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function _colDragOver(e) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const target = e.currentTarget;
  if (target !== _dragSrc) target.classList.add('drag-over');
}
function _colDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function _colDragEnd(e)   { e.currentTarget.classList.remove('dragging'); }

function _colDrop(e) {
  e.preventDefault();
  const target = e.currentTarget;
  target.classList.remove('drag-over');
  if (!_dragSrc || _dragSrc === target) return;

  // Reorder DOM
  const panel = document.getElementById('col-panel');
  const items = [...panel.querySelectorAll('.col-item')];
  const fromIdx = items.indexOf(_dragSrc);
  const toIdx   = items.indexOf(target);
  if (fromIdx < 0 || toIdx < 0) return;
  if (fromIdx < toIdx) panel.insertBefore(_dragSrc, target.nextSibling);
  else                 panel.insertBefore(_dragSrc, target);

  // Save new order
  const newOrder = [...panel.querySelectorAll('.col-item')].map(el => el.dataset.k);
  getColState(tab).order = newOrder;
  saveColState(tab);
  render();
  _dragSrc = null;
}

// ── Core functions ────────────────────────────────────────────────────────────
function switchTab(t) {
  tab     = t;
  sortKey = '開標日期';
  sortDir = -1;
  Object.keys(filters).forEach(k => delete filters[k]);
  Object.keys(filterRaw).forEach(k => delete filterRaw[k]);
  document.getElementById('search').value = '';
  document.querySelectorAll('.tab').forEach((b,i) =>
    b.classList.toggle('active', (t==='stocks') === (i===0)));
  const panel = document.getElementById('col-panel');
  if (panel && panel.classList.contains('open')) _buildColPanel();
  document.getElementById('rel-n-ctrl').style.display = (t === 'stocks') ? '' : 'none';
  render();
}

function nv(s) {
  if (s == null || s === '' || s === 'nan' || s === 'None') return NaN;
  return parseFloat(String(s).replace(/,/g,''));
}

function cmpV(a, b, t) {
  if (t === 'num') {
    const na = nv(a), nb = nv(b);
    if (isNaN(na) && isNaN(nb)) return 0;
    if (isNaN(na)) return 1;
    if (isNaN(nb)) return -1;
    return na - nb;
  }
  return String(a||'').localeCompare(String(b||''), 'zh-TW');
}

function rowStatus(row) {
  const cancel = String(row['取消競價拍賣(流標或取消)']||'').trim();
  if (cancel) return 'cancel';
  const bidEnd = String(row['投標結束日']||'').trim();
  if (!bidEnd) return 'done';
  const parts = bidEnd.split('/');
  const d = new Date(+parts[0], +parts[1]-1, +parts[2]);
  const today = new Date(); today.setHours(0,0,0,0);
  if (d >= today) return 'pending';
  const qty = nv(row['合格投標數量(張)']);
  if (isNaN(qty) || qty === 0) return 'noresult';
  return 'done';
}

function fmtN(val, decimals) {
  const n = nv(val);
  if (isNaN(n)) return '';
  return n.toLocaleString('zh-TW', {maximumFractionDigits: decimals ?? 2});
}

function colVal(col, row) {
  return col.calc ? col.calc(row) : row[col.k];
}

function cellHtml(col, row) {
  const raw = colVal(col, row);
  const str = (raw == null || raw === 'nan' || raw === 'None' || (typeof raw === 'number' && isNaN(raw))) ? '' : String(raw).trim();

  if (col.k === '發行市場') {
    if (!str) return '';
    const short = str.includes('集中') ? '上市' : str.includes('櫃') ? '上櫃' : str;
    const cls   = str.includes('集中') ? 'b-tse' : 'b-otc';
    return `<span class="badge ${cls}">${short}</span>`;
  }
  if (col.k === '取消競價拍賣(流標或取消)' && str) {
    return `<span class="badge b-cncl">${str}</span>`;
  }
  if (col.k === '發行性質' && str.includes('有擔')) {
    return `<span class="txt-secured">${str}</span>`;
  }
  if (col.t === 'num') {
    const n = typeof raw === 'number' ? raw : nv(raw);
    if (isNaN(n)) return '';
    const decimals = col.decimals ?? 2;
    const fmt = v => (typeof v === 'number' ? v : nv(v)).toLocaleString('zh-TW', {maximumFractionDigits: decimals, minimumFractionDigits: decimals > 0 ? decimals : 0});
    if (col.cmp) {
      const avg = nv(row['得標加權平均價格(元)']);
      if (!isNaN(avg) && avg > 0) {
        if (n > avg) return `<span class="hi-up">${fmt(n)}</span>`;
        if (n < avg) return `<span class="hi-dn">${fmt(n)}</span>`;
      }
    }
    return fmt(n);
  }
  return str;
}

function render() {
  const cols    = getEffectiveCols();
  const allCols = tab === 'stocks' ? STOCK_COLS : CB_COLS;  // full list for filter/sort lookup
  const raw     = RAW[tab];
  const q       = document.getElementById('search').value.toLowerCase().trim();

  // ① text search
  let rows = q ? raw.filter(r =>
    (String(r['證券代號']||'') + String(r['證券名稱']||'') + String(r['開標日期']||'')).toLowerCase().includes(q)
  ) : [...raw];

  // ② column filters (numeric) — apply against ALL cols, even if currently hidden
  const activeFilters = Object.entries(filters);
  if (activeFilters.length) {
    rows = rows.filter(row =>
      activeFilters.every(([key, f]) => {
        const c = allCols.find(c => c.k === key);
        const v = c ? (c.calc ? c.calc(row) : nv(row[key])) : nv(row[key]);
        return applyFilter(f, typeof v === 'number' ? v : nv(v));
      })
    );
  }

  // ③ sort — look up col def from full list so computed cols sort correctly
  const colDef = allCols.find(c => c.k === sortKey) || allCols[0];
  rows.sort((a, b) => {
    const va = colDef.calc ? colDef.calc(a) : a[sortKey];
    const vb = colDef.calc ? colDef.calc(b) : b[sortKey];
    return sortDir * cmpV(va, vb, colDef.t);
  });

  // ── Header row ──
  const headerRow = '<tr>' + cols.map(c => {
    const active = c.k === sortKey;
    const cls    = active ? (sortDir === 1 ? 'asc' : 'desc') : '';
    const safeK = c.k.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<th class="${cls}" data-col-key="${safeK}" onclick="sortBy('${c.k}')">${c.lab}<span class="si"></span><div class="resizer" onmousedown="onRzDown(event,this)" ondblclick="onRzDblClick(event,this)"></div></th>`;
  }).join('') + '</tr>';

  // ── Filter row ──
  // Remember focused filter input so we can restore it after innerHTML rebuild
  const focusedEl  = document.activeElement;
  const focusedKey = focusedEl?.classList?.contains('fi') ? focusedEl.dataset.key : null;
  const focusedPos = focusedKey ? focusedEl.selectionStart : 0;

  const filterRow = '<tr class="filter-row">' + cols.map(c => {
    if (c.t !== 'num') return '<th></th>';
    const safeKey = c.k.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    const curF    = filters[c.k];
    // Prefer raw text user typed (handles partial input like ">" or "90-")
    let curV = '';
    if (c.k in filterRaw) {
      curV = filterRaw[c.k];
    } else if (curF) {
      curV = (curF.op === 'range') ? `${curF.v1}~${curF.v2}` : `${curF.op}${curF.v1}`;
    }
    const safeV = curV.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<th><input class="fi${curF?' active':''}" data-key="${safeKey}" ` +
           `value="${safeV}" placeholder=">50 &lt;100 50~100" ` +
           `oninput="onFilterInput(this)" onclick="event.stopPropagation()" ` +
           `title="篩選：&gt;90  &lt;90  >=90  <=90  90~105  90-105"></th>`;
  }).join('') + '</tr>';

  document.getElementById('thead').innerHTML = headerRow + filterRow;
  initResizers();

  // Restore focus & cursor to the filter input that was active before rebuild
  if (focusedKey) {
    const el = document.querySelector(`.fi[data-key="${focusedKey.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"]`);
    if (el) { el.focus(); el.setSelectionRange(focusedPos, focusedPos); }
  }

  // ── Body ──
  const empty = document.getElementById('empty');
  const tbody = document.getElementById('tbody');
  if (rows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = rows.map(row => {
      const s     = rowStatus(row);
      const cells = cols.map(c => {
        let cls = c.t === 'num' ? ' r' : '';
        if (c.cls) cls += ' ' + c.cls;
        return `<td class="${cls.trim()}">${cellHtml(c, row)}</td>`;
      }).join('');
      return `<tr class="s-${s}">${cells}</tr>`;
    }).join('');
  }
  const total = activeFilters.length ? `${rows.length} / ${raw.length}` : `${rows.length}`;
  document.getElementById('stat').textContent = `${total} 筆`;
}

function sortBy(key) {
  sortDir = (sortKey === key) ? -sortDir : -1;
  sortKey = key;
  render();
}

let _cbChart = null, _stkChart = null;

const CHART_OPTS = {
  responsive: true, maintainAspectRatio: false,
  animation: false,
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: '#1A1A1A', borderColor: '#FF6600', borderWidth: 1,
      titleColor: '#FF6600', bodyColor: '#C8C8C8',
      callbacks: { label: ctx => ctx.raw._label }
    }
  },
  scales: {
    x: { grid: { color: '#222' }, ticks: { color: '#888' },
         title: { display: true, color: '#FF6600', font: { size: 12 } } },
    y: { grid: { color: '#222' }, ticks: { color: '#888' },
         title: { display: true, color: '#FF6600', font: { size: 12 } } }
  }
};

function _parseDate(s) {
  if (!s) return null;
  return s.replace(/\//g, '-');   // YYYY-MM-DD
}

function openChart() {
  const btn = document.getElementById('btn-chart');
  btn.classList.add('active');
  if (tab === 'cbs') {
    document.getElementById('modal-cb').classList.add('open');
    renderCbChart();
  } else {
    document.getElementById('modal-stk').classList.add('open');
    renderStkChart();
  }
}

function closeChart() {
  document.getElementById('modal-cb').classList.remove('open');
  document.getElementById('modal-stk').classList.remove('open');
  document.getElementById('btn-chart').classList.remove('active');
}

function renderCbChart() {
  const dateFrom = document.getElementById('cb-date-from').value;
  const dateTo   = document.getElementById('cb-date-to').value;
  const tcriMin  = document.getElementById('cb-tcri-min').value;
  const tcriMax  = document.getElementById('cb-tcri-max').value;
  const volMin   = parseFloat(document.getElementById('cb-vol-min').value) || 0;
  const parMin   = parseFloat(document.getElementById('cb-parity-min').value);
  const parMax   = parseFloat(document.getElementById('cb-parity-max').value);

  const points = [];
  for (const r of RAW.cbs) {
    const d = _parseDate(r['投標結束日']);
    if (dateFrom && d < dateFrom) continue;
    if (dateTo   && d > dateTo)   continue;

    const close = nv(r['投標結束日收盤價']);
    const conv  = nv(r['發行時轉換價']);
    if (isNaN(close) || isNaN(conv) || conv <= 0) continue;
    const parity  = close / conv * 100;
    const lowBid  = nv(r['最低得標價格(元)']);
    if (isNaN(lowBid) || parity <= 0) continue;
    const premium = (lowBid / parity - 1) * 100;

    const code4 = String(r['證券代號']).substring(0, 4);
    const tcri  = TCRI_MAP[code4];
    if (tcriMin !== '' && (tcri === undefined || tcri < parseInt(tcriMin))) continue;
    if (tcriMax !== '' && (tcri === undefined || tcri > parseInt(tcriMax))) continue;

    const vol = nv(r['競拍數量(張)']);
    if (vol < volMin) continue;
    if (!isNaN(parMin) && parity < parMin) continue;
    if (!isNaN(parMax) && parity > parMax) continue;

    points.push({ x: parseFloat(parity.toFixed(2)), y: parseFloat(premium.toFixed(2)),
                  _label: `${r['證券名稱']} (${r['證券代號']})\nParity: ${parity.toFixed(1)}%  溢價: ${premium.toFixed(1)}%\n截止: ${r['投標結束日']}` });
  }

  const opts = JSON.parse(JSON.stringify(CHART_OPTS));
  opts.scales.x.title.text = '截拍日 Parity (%)';
  opts.scales.y.title.text = '最低標溢價率 (%)';
  opts.plugins.tooltip.callbacks.label = ctx => ctx.raw._label.split('\n');

  const canvas = document.getElementById('canvas-cb');
  if (_cbChart) _cbChart.destroy();
  _cbChart = new Chart(canvas, {
    type: 'scatter',
    data: { datasets: [{ data: points, backgroundColor: '#FF660088', pointRadius: 5,
                          pointHoverRadius: 8, pointHoverBackgroundColor: '#FF6600' }] },
    options: opts
  });
  document.getElementById('cb-legend').textContent = `顯示 ${points.length} 筆（僅含結標且有收盤價資料）`;
}

function renderStkChart() {
  const dateFrom = document.getElementById('stk-date-from').value;
  const dateTo   = document.getElementById('stk-date-to').value;
  const ndays    = document.getElementById('stk-ndays').value;   // '5','10','20'
  const relMin   = parseFloat(document.getElementById('stk-rel-min').value);
  const relMax   = parseFloat(document.getElementById('stk-rel-max').value);
  const relKey   = `相對大盤漲跌_${ndays}d`;

  const points = [];
  for (const r of RAW.stocks) {
    const d = _parseDate(r['投標結束日']);
    if (dateFrom && d < dateFrom) continue;
    if (dateTo   && d > dateTo)   continue;

    const close  = nv(r['投標結束日收盤價']);
    const lowBid = nv(r['最低得標價格(元)']);
    if (isNaN(close) || isNaN(lowBid) || close <= 0) continue;
    const discount = lowBid / close * 100;

    const rel = r[relKey];
    if (rel == null || rel === '') continue;
    const relF = parseFloat(rel);
    if (isNaN(relF)) continue;
    if (!isNaN(relMin) && relF < relMin) continue;
    if (!isNaN(relMax) && relF > relMax) continue;

    points.push({ x: parseFloat(relF.toFixed(2)), y: parseFloat(discount.toFixed(2)),
                  _label: `${r['證券名稱']} (${r['證券代號']})\n相對大盤(${ndays}d): ${relF.toFixed(2)}%  得標折價率: ${discount.toFixed(2)}%\n截止: ${r['投標結束日']}` });
  }

  const opts = JSON.parse(JSON.stringify(CHART_OPTS));
  opts.scales.x.title.text = `截拍前相對大盤漲跌% (${ndays} 個交易日)`;
  opts.scales.y.title.text = '得標折價率% (最低得標/收盤×100)';
  opts.plugins.tooltip.callbacks.label = ctx => ctx.raw._label.split('\n');

  const canvas = document.getElementById('canvas-stk');
  if (_stkChart) _stkChart.destroy();
  _stkChart = new Chart(canvas, {
    type: 'scatter',
    data: { datasets: [{ data: points, backgroundColor: '#00CC4488', pointRadius: 5,
                          pointHoverRadius: 8, pointHoverBackgroundColor: '#00CC44' }] },
    options: opts
  });
  document.getElementById('stk-legend').textContent = `顯示 ${points.length} 筆（僅含結標且有收盤價及相對大盤資料）`;
}
</script>
</body>
</html>
