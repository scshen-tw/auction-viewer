name: Daily Auction Update

on:
  # Keep GitHub Actions manual-only. The Windows scheduler is the daily source
  # because it can read local Outlook data before committing and pushing.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run incremental update
        run: python auction_fetcher.py --update

      - name: Commit remaining changes
        run: |
          git add auction_stocks.json auction_cbs.json price_cache.json hvol_cache.json taiex_cache.json auction_viewer.html
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: daily update $(date +'%Y-%m-%d')" && git push
